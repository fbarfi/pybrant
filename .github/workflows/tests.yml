name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test]"
      - run: pytest -q

  statsmodels-0-14:
    # formula specification kept as model.data.design_info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test]" "statsmodels>=0.14,<0.15" "pandas<3"
      - run: pytest -q

  formulaic-engine:
    # statsmodels 0.15 with the formulaic formula engine (ModelSpec)
    runs-on: ubuntu-latest
    env:
      SM_FORMULA_ENGINE: formulaic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test]" "statsmodels>=0.15"
      - run: pytest -q
