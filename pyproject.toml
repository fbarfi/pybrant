[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pybrant"
version = "0.1.0"
description = "Brant's test of the proportional-odds assumption for statsmodels OrderedModel"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Badredine Arfi" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.4", "scipy>=1.8", "statsmodels>=0.13"]
keywords = ["brant test", "proportional odds", "parallel regression", "ordinal logit",
            "ordered logit", "statsmodels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/fbarfi/pybrant"
Issues = "https://github.com/fbarfi/pybrant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
